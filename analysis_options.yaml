include: package:lint/analysis_options.yaml

analyzer:
  language:
    strict-casts: true
    strict-inference: true
    strict-raw-types: true
  exclude:
    - "**.g.dart"
    - "lib/l10n/app_localizations*.dart"
    - build/**
    - android/**

linter:
  rules:
    document_ignores: false
    sort_pub_dependencies: false

formatter:
  page_width: 120
  trailing_commas: preserve
