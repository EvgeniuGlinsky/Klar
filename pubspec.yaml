name: klar
description: "Klar — задачи с будильниками"
publish_to: 'none'
version: 1.0.0+1

environment:
  sdk: ^3.13.3

dependencies:
  collection: ^1.19.1
  drift: ^2.35.2
  drift_flutter: ^0.3.1
  equatable: ^3.0.0
  flutter:
    sdk: flutter
  flutter_bloc: ^9.1.1
  flutter_localizations:
    sdk: flutter
  get_it: ^9.3.0
  go_router: ^18.0.2
  intl: ^0.20.3
  path_provider: ^2.1.6
  phosphor_flutter: ^2.1.0
  rxdart: ^0.28.0
  uuid: ^4.6.0

dev_dependencies:
  bloc_test: ^10.0.0
  build_runner: ^2.16.1
  drift_dev: ^2.35.1
  flutter_test:
    sdk: flutter
  lint: ^2.14.0
  mocktail: ^1.0.5

flutter:
  generate: true
  uses-material-design: true

  assets:
    - assets/fonts/

  fonts:
    - family: Manrope
      fonts:
        - asset: assets/fonts/Manrope-Light.ttf
          weight: 300
        - asset: assets/fonts/Manrope-Regular.ttf
          weight: 400
        - asset: assets/fonts/Manrope-Medium.ttf
          weight: 500
        - asset: assets/fonts/Manrope-SemiBold.ttf
          weight: 600
        - asset: assets/fonts/Manrope-Bold.ttf
          weight: 700
